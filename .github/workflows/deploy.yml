# Builds a deployable bundle and publishes it to Firebase Hosting.
#
# Manual on purpose (`workflow_dispatch`): change the trigger to `push` on
# `main` once the deployment has been exercised by hand at least once.
#
# Configuration comes from the `production` environment, not from repository
# secrets, so the values are scoped to deployments and GitHub records a
# deployment history. Adding required reviewers to that environment is enough to
# gate releases — no workflow change needed.
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Firebase Hosting
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ steps.hosting.outputs.details_url }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A missing value would produce a bundle that throws on load and shows a
      # blank page, so the run stops here rather than shipping one.
      - name: Verify the build configuration is complete
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_AUTH_USERNAME_DOMAIN: ${{ secrets.VITE_AUTH_USERNAME_DOMAIN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            FIREBASE_SERVICE_ACCOUNT
          do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          # Analytics is optional by design, so this is a warning rather than a
          # failure — but shipping with it silently off should still be visible.
          # Reported before the exit below, so one run lists everything that is
          # wrong instead of surfacing the next problem only after a fix.
          if [ -z "$VITE_FIREBASE_MEASUREMENT_ID" ]; then
            echo "::warning::VITE_FIREBASE_MEASUREMENT_ID is not set; Analytics will be disabled in this build."
          fi

          # Presence is not correctness. Two secrets once held each other's
          # values — the sign-in domain held a measurement id — and the build
          # shipped, because every variable was non-empty. These check the shape
          # each value must have, and never echo a value.
          malformed=""
          expect() {
            printf '%s' "$2" | grep -qE "$3" || malformed="$malformed $1"
          }
          expect VITE_FIREBASE_API_KEY "$VITE_FIREBASE_API_KEY" '^AIza[0-9A-Za-z_-]{30,}$'
          expect VITE_FIREBASE_AUTH_DOMAIN "$VITE_FIREBASE_AUTH_DOMAIN" '^[a-z0-9.-]+\.[a-z]{2,}$'
          expect VITE_FIREBASE_PROJECT_ID "$VITE_FIREBASE_PROJECT_ID" '^[a-z0-9-]+$'
          expect VITE_FIREBASE_MESSAGING_SENDER_ID "$VITE_FIREBASE_MESSAGING_SENDER_ID" '^[0-9]+$'
          expect VITE_FIREBASE_APP_ID "$VITE_FIREBASE_APP_ID" ':web:'
          [ -z "$VITE_FIREBASE_MEASUREMENT_ID" ] || \
            expect VITE_FIREBASE_MEASUREMENT_ID "$VITE_FIREBASE_MEASUREMENT_ID" '^G-[A-Z0-9]+$'
          [ -z "$VITE_AUTH_USERNAME_DOMAIN" ] || \
            expect VITE_AUTH_USERNAME_DOMAIN "$VITE_AUTH_USERNAME_DOMAIN" '^[a-z0-9.-]+\.[a-z]{2,}$'

          # The Hosting target and the project the client talks to must agree,
          # or the deploy publishes against a project the app never queries.
          if [ "$VITE_FIREBASE_AUTH_DOMAIN" != "${VITE_FIREBASE_PROJECT_ID}.firebaseapp.com" ]; then
            echo "::warning::VITE_FIREBASE_AUTH_DOMAIN is not <project-id>.firebaseapp.com — expected for a default Firebase setup."
          fi

          if [ -n "$malformed" ]; then
            echo "::error::Secrets whose value does not match the expected shape:$malformed"
            exit 1
          fi

          if [ -n "$missing" ]; then
            echo "::error::Missing secrets in the 'production' environment:$missing"
            exit 1
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          # Optional. Unset, the application falls back to
          # `classes.talendig.local`, which is the domain the Firebase Auth
          # accounts must then be created with.
          VITE_AUTH_USERNAME_DOMAIN: ${{ secrets.VITE_AUTH_USERNAME_DOMAIN }}
        run: pnpm build

      - name: Deploy
        id: hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The Hosting target is the same project the client talks to.
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          channelId: live
